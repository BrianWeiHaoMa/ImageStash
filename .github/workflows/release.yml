# Publishes the GitHub release for a pushed tag v<version>, and only once the whole release suite,
# tools/check-release.ps1, has passed on this tag's tree: the script first refuses a tag that does not match
# Directory.Build.props and CHANGELOG.md, and writes that version's changelog section as the release's notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # The desktop checks need an interactive desktop; the repository variable DESKTOP_RUNNER, when set, names the
    # runner label to use instead of the hosted image.
    runs-on: ${{ vars.DESKTOP_RUNNER || 'windows-2025' }}
    # A desktop check that hangs on a runner without a usable desktop is stopped here, not at the six-hour default.
    timeout-minutes: 120
    defaults:
      run:
        # Windows PowerShell 5.1, which the scripts are written for; the Windows default, pwsh, is PowerShell 7.
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Read the version
        id: version
        run: |
          $version = "$(([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version)".Trim()
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n")
      - name: Report and raise the runner's desktop
        run: powershell.exe -NoProfile -File tools/runner-desktop.ps1
      - name: Run the release suite, the tag's identity first
        run: powershell.exe -NoProfile -File tools/check-release.ps1 -Output "$env:RUNNER_TEMP\release" -Tag "$env:GITHUB_REF_NAME" -Notes "$env:RUNNER_TEMP\notes.md"
      # Last, and with no condition: a failed step above ends the job before anything is published.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$env:GITHUB_REF_NAME" --verify-tag --title "ImageStash $env:VERSION" --notes-file "$env:RUNNER_TEMP\notes.md" "$env:RUNNER_TEMP\release\ImageStash-$env:VERSION-win-x64.msi" "$env:RUNNER_TEMP\release\ImageStash-$env:VERSION-win-x64.zip" "$env:RUNNER_TEMP\release\SHA256SUMS.txt"
