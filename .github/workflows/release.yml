# Publishes the GitHub release for a pushed tag v<version>, and only once the release suite's phases that need no
# desktop, tools/check-release.ps1 -NoDesktop, have passed on this tag's tree: the script first refuses a tag that does
# not match Directory.Build.props and CHANGELOG.md, and writes that version's changelog section as the release's notes.
# The whole suite, which the elevated hosted job cannot judge, runs on a Windows PC before the tag (RELEASING.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    # The phases take about a quarter of an hour here; a run that hangs is stopped well short of the six-hour default.
    timeout-minutes: 45
    defaults:
      run:
        # Windows PowerShell 5.1, which the scripts are written for; the Windows default, pwsh, is PowerShell 7.
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Read the version
        id: version
        run: |
          $version = "$(([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version)".Trim()
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n")
      - name: Run the release suite's hosted phases, the tag's identity first
        run: powershell.exe -NoProfile -File tools/check-release.ps1 -NoDesktop -Output "$env:RUNNER_TEMP\release" -Tag "$env:GITHUB_REF_NAME" -Notes "$env:RUNNER_TEMP\notes.md"
      # Last, and with no condition: a failed step above ends the job before anything is published.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$env:GITHUB_REF_NAME" --verify-tag --title "ImageStash $env:VERSION" --notes-file "$env:RUNNER_TEMP\notes.md" "$env:RUNNER_TEMP\release\ImageStash-$env:VERSION-win-x64.msi" "$env:RUNNER_TEMP\release\ImageStash-$env:VERSION-win-x64.zip" "$env:RUNNER_TEMP\release\SHA256SUMS.txt"
