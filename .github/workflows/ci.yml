# Runs the release suite's phases that need no desktop, tools/check-release.ps1 -NoDesktop (the build, the portable
# checks and the release's assets), on every pushed branch and pull request, and keeps the assets as an artifact. The
# hosted job runs elevated, so the desktop, published and installer phases cannot pass or prove anything here; they run
# in the whole suite on a Windows PC before a tag (RELEASING.md).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: windows-2025
    # The phases take about a quarter of an hour here; a run that hangs is stopped well short of the six-hour default.
    timeout-minutes: 45
    defaults:
      run:
        # Windows PowerShell 5.1, which the scripts are written for; the Windows default, pwsh, is PowerShell 7.
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Read the version
        id: version
        run: |
          $version = "$(([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version)".Trim()
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n")
      - name: Run the release suite's hosted phases
        run: powershell.exe -NoProfile -File tools/check-release.ps1 -NoDesktop -Output "$env:RUNNER_TEMP\release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ImageStash-${{ steps.version.outputs.version }}-win-x64
          path: |
            ${{ runner.temp }}/release/ImageStash-${{ steps.version.outputs.version }}-win-x64.msi
            ${{ runner.temp }}/release/ImageStash-${{ steps.version.outputs.version }}-win-x64.zip
            ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: error
